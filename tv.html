    const ALL_MEMBER_NUMBERS=[...new Set(CATEGORIES.flatMap(category=>category.teams.flatMap(team=>team[1].map(player=>player[0]))))];
    let cardsByMember=new Map(),namesByMember=new Map(),screenIndex=0,cycleToken=0,realtimeChannel=null,loading=false,lastDataSignature=null;
    const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const number=v=>{const x=Number(String(v??"").replace(",","."));return Number.isFinite(x)&&x>0?x:null};
    const validCard=c=>c&&String(c.card_status||"").toLowerCase()==="valid"&&number(c.gross)!==null;
    function requiredCards(categoryIndex){return categoryIndex===0?4:categoryIndex===5?2:3}
    function holeStroke(card,hole){const value=card?.hole_scores?.[hole]??card?.hole_scores?.[String(hole)];return number(value&&typeof value==="object"?value.strokes:value)}
    function closingScore(card,from){let total=0;for(let hole=from;hole<=18;hole++){const value=holeStroke(card,hole);if(value===null)return null;total+=value}return total}
    function compareCards(a,b){
      if(a.score!==b.score)return a.score-b.score;
      for(const from of [10,13,16,18]){const av=closingScore(a.card,from),bv=closingScore(b.card,from);if(av!==null&&bv!==null&&av!==bv)return av-bv;if(av!==null&&bv===null)return-1;if(av===null&&bv!==null)return 1}
      return a.name.localeCompare(b.name,"es");
    }
    function teamResult(raw,required){
      const players=raw[1].map(([member,excelName])=>{const card=cardsByMember.get(String(member));const name=namesByMember.get(String(member))||card?.display_name||excelName;return{member,name,card,score:validCard(card)?number(card.gross):null}});
      const scored=players.filter(p=>p.score!==null).sort(compareCards);const missing=players.filter(p=>p.score===null).sort((a,b)=>a.name.localeCompare(b.name,"es"));const orderedPlayers=[...scored,...missing];const used=new Set(scored.slice(0,required).map(p=>p.member));
      return{club:raw[0],players:orderedPlayers,required,complete:scored.length>=required,count:scored.length,total:scored.length>=required?scored.slice(0,required).reduce((s,p)=>s+p.score,0):null,partial:scored.reduce((s,p)=>s+p.score,0),used};
    }
    function rankedCategory(cat,categoryIndex){
      const required=requiredCards(categoryIndex);const teams=cat.teams.map(team=>teamResult(team,required)).sort((a,b)=>{if(a.complete!==b.complete)return a.complete?-1:1;if(a.complete)return a.total-b.total||a.club.localeCompare(b.club,"es");return b.count-a.count||a.partial-b.partial||a.club.localeCompare(b.club,"es")});
      let rank=0,last=null;teams.forEach((t,i)=>{if(t.complete){if(last===null||t.total!==last)rank=i+1;t.rank=rank;last=t.total}else t.rank=null});return teams;
    }
    function teamHtml(t){
      const players=t.players.filter(p=>p.score!==null).map(p=>{let cls="missing",score="–";if(p.score!==null){cls=t.used.has(p.member)?"used":"discarded";score=p.score}return`<div class="player ${cls}"><span class="player-name">${esc(p.name)}</span><span class="player-score">${score}</span></div>`}).join("");
      const label=t.complete?`Total ${t.required} mejores`:`${t.count}/${t.required} tarjetas`;const value=t.complete?t.total:"Parcial";
      return`<article class="team ${t.rank===1?"first":""} ${t.complete?"":"partial"}"><div class="rank">${t.rank?`${t.rank}°`:"–"}</div><div class="team-main"><div class="team-name">${esc(t.club)}</div><div class="players">${players}</div></div><div class="total"><div class="total-value">${value}</div><div class="total-label">${label}</div></div></article>`;
    }
    function categoryHtml(cat,viewportIndex,categoryIndex){const required=requiredCards(categoryIndex),teams=rankedCategory(cat,categoryIndex);return`<section class="category"><div class="cat-head"><div class="cat-title">${esc(cat.name)}</div><div class="cat-note">${teams.length} clubes · suman ${required}</div></div><div class="viewport" data-viewport="${viewportIndex}"><div class="team-list">${teams.map(teamHtml).join("")||'<div class="empty">Sin equipos</div>'}</div></div></section>`}
    function renderScreens(){
      cycleToken++;const host=document.getElementById("categories");host.innerHTML=`<div class="screen-track">${SCREEN_GROUPS.map((group,screen)=>`<section class="category-screen" data-screen="${screen}">${group.map((i,n)=>categoryHtml(CATEGORIES[i],n,i)).join("")}</section>`).join("")}</div>`;
      const track=host.querySelector(".screen-track");track.style.transition="none";track.style.transform=`translateY(-${screenIndex*100}%)`;document.getElementById("pages").textContent=`Pantalla ${screenIndex+1} de ${SCREEN_GROUPS.length}`;requestAnimationFrame(()=>startScroll(cycleToken));
    }
    function startScroll(token){
      const views=[...document.querySelectorAll(`.category-screen[data-screen="${screenIndex}"] .viewport`)];views.forEach(v=>{v.firstElementChild.style.transition="none";v.firstElementChild.style.transform="translateY(0)"});const distances=views.map(v=>Math.max(0,v.firstElementChild.scrollHeight-v.clientHeight));const maxDistance=Math.max(0,...distances);const scrollMs=maxDistance?Math.max(7000,maxDistance/PIXELS_PER_SECOND*1000):5000;
      setTimeout(()=>{if(token!==cycleToken)return;views.forEach((v,i)=>{const list=v.firstElementChild;list.style.transition=`transform ${scrollMs}ms linear`;list.style.transform=`translateY(-${distances[i]}px)`})},PAUSE_MS);
      setTimeout(()=>{if(token!==cycleToken)return;moveScreen(screenIndex===0?1:0,token)},PAUSE_MS+scrollMs+END_PAUSE_MS);
    }
    function moveScreen(next,token){const track=document.querySelector(".screen-track");if(!track||token!==cycleToken)return;track.style.transition="transform 1800ms cubic-bezier(.65,0,.35,1)";track.style.transform=`translateY(-${next*100}%)`;document.getElementById("pages").textContent=`Pantalla ${next+1} de ${SCREEN_GROUPS.length}`;setTimeout(()=>{if(token!==cycleToken)return;screenIndex=next;startScroll(token)},1850)}
    async function loadData(){if(loading)return;loading=true;try{
      const [{data:tournament,error:te},{data:cards,error:ce},{data:aagPlayers,error:pe}]=await Promise.all([
        supabase.from("tournaments").select("id,name,tournament_date").eq("id",TOURNAMENT_ID).single(),
        supabase.from("scorecards").select("id,aag_member_number,display_name,gross,card_status,hole_scores").eq("tournament_id",TOURNAMENT_ID),
        supabase.from("players").select("aag_member_number,full_name").in("aag_member_number",ALL_MEMBER_NUMBERS)
      ]);if(te)throw te;if(ce)throw ce;
      if(tournament?.name)document.getElementById("title").textContent=tournament.name;const date=String(tournament?.tournament_date||"").split("-");document.getElementById("meta").textContent=date.length===3?`${date[2]}/${date[1]}/${date[0]} · Medal Play por equipos`:"Medal Play por equipos";
      if(pe)console.warn("No se pudieron actualizar los nombres desde players; se usarán los de las tarjetas o el Excel.",pe);
      namesByMember=new Map();(aagPlayers||[]).forEach(player=>{const key=String(player.aag_member_number||"").trim();if(key&&player.full_name)namesByMember.set(key,String(player.full_name).trim())});
      const signature=JSON.stringify({cards:(cards||[]).map(c=>[c.id,c.aag_member_number,c.display_name,c.gross,c.card_status,c.hole_scores]).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))),names:[...namesByMember.entries()].sort((a,b)=>a[0].localeCompare(b[0]))});
      cardsByMember=new Map();(cards||[]).forEach(c=>{const key=String(c.aag_member_number||"").trim();if(key)cardsByMember.set(key,c)});
      if(signature!==lastDataSignature){lastDataSignature=signature;renderScreens()}document.getElementById("loading").classList.add("hidden");
    }catch(err){console.error(err);document.getElementById("loading").textContent=`No se pudieron cargar los resultados: ${err?.message||"error"}`}
    finally{loading=false}}
    function startRealtime(){realtimeChannel=supabase.channel(`interclubes-${TOURNAMENT_ID}`).on("postgres_changes",{event:"*",schema:"public",table:"scorecards",filter:`tournament_id=eq.${TOURNAMENT_ID}`},loadData).subscribe()}
    function clock(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}
    document.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="f")document.documentElement.requestFullscreen?.();if(e.key==="ArrowRight"||e.key==="ArrowLeft"){cycleToken++;moveScreen(screenIndex===0?1:0,cycleToken)}});
    document.addEventListener("click",()=>document.documentElement.requestFullscreen?.(),{once:true});clock();setInterval(clock,1000);await loadData();startRealtime();setInterval(loadData,REFRESH_MS);
